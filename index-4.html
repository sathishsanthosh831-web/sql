<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QueryDeck — SQL Playground</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
  :root{
    --bg: #0d1117;
    --panel: #111820;
    --panel-2: #0a0f14;
    --line: #1f2b33;
    --text: #d8e2e8;
    --muted: #74899a;
    --amber: #e7a33e;
    --teal: #3ea79b;
    --red: #d9645b;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #0f151c, #0d1117);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    color:var(--amber);
    font-weight:700;
    font-size:18px;
    letter-spacing:0.5px;
  }
  .brand .tag{
    color:var(--muted);
    font-size:12px;
  }
  .status{
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 8px var(--teal);
  }
  .layout{
    display:grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 52px);
  }
  @media (max-width: 800px){
    .layout{grid-template-columns: 1fr;}
    .schema{order:2; border-right:none !important; border-top:1px solid var(--line);}
  }
  .schema{
    border-right:1px solid var(--line);
    background:var(--panel-2);
    padding:18px 16px;
    overflow-y:auto;
  }
  .schema h3{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 12px 0;
  }
  .table-block{
    margin-bottom:16px;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .table-block .t-name{
    background:#131c24;
    padding:8px 10px;
    color:var(--amber);
    font-size:13px;
    font-weight:600;
  }
  .table-block .t-cols{
    padding:8px 10px;
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
  }
  .table-block .t-cols span.pk{
    color:var(--teal);
  }
  .main{
    display:flex;
    flex-direction:column;
    padding:18px 22px;
    gap:14px;
    min-width:0;
  }
  .editor-wrap{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    overflow:hidden;
  }
  .editor-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    background:#0f151c;
  }
  .editor-head .lbl{
    font-size:11px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--muted);
  }
  textarea{
    width:100%;
    min-height:160px;
    background:transparent;
    color:var(--text);
    border:none;
    outline:none;
    resize:vertical;
    font-family:var(--mono);
    font-size:14.5px;
    line-height:1.6;
    padding:14px;
  }
  .controls{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  button{
    font-family:var(--mono);
    font-size:13px;
    border:1px solid var(--line);
    background:#141d26;
    color:var(--text);
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s ease, transform .05s ease;
  }
  button:hover{ border-color:var(--amber); }
  button:active{ transform:translateY(1px); }
  .run{
    background:var(--amber);
    color:#161008;
    font-weight:700;
    border:none;
  }
  .run:hover{ filter:brightness(1.08); border:none; }
  select{
    font-family:var(--mono);
    background:#141d26;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
  }
  .hint{
    color:var(--muted);
    font-size:12px;
  }
  .results{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    flex:1;
    min-height:220px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .results-head{
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    background:#0f151c;
    font-size:11px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .results-body{
    overflow:auto;
    padding:0;
  }
  table{
    border-collapse:collapse;
    width:100%;
    font-size:13px;
  }
  th, td{
    text-align:left;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  th{
    background:#0f151c;
    color:var(--amber);
    position:sticky;
    top:0;
    font-weight:600;
  }
  tr:hover td{ background:#101820; }
  .msg{
    padding:16px;
    color:var(--muted);
  }
  .msg.err{ color:var(--red); }
  .msg.ok{ color:var(--teal); }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:14px;
    border-top:1px solid var(--line);
  }
  footer a{ color:var(--teal); text-decoration:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">QueryDeck</span>
    <span class="tag">// SQL playground, runs entirely in your browser</span>
  </div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">loading engine…</span></div>
</div>

<div class="layout">
  <aside class="schema" id="schemaPanel">
    <h3>Schema</h3>
    <div id="schemaList">Loading…</div>
  </aside>

  <main class="main">
    <div class="editor-wrap">
      <div class="editor-head">
        <span class="lbl">Query editor</span>
        <span class="hint">Ctrl / Cmd + Enter to run</span>
      </div>
      <textarea id="sqlInput" spellcheck="false">SELECT customers.name, COUNT(orders.id) AS total_orders, SUM(orders.amount) AS total_spent
FROM customers
JOIN orders ON orders.customer_id = customers.id
GROUP BY customers.name
ORDER BY total_spent DESC;</textarea>
    </div>

    <div class="controls">
      <button class="run" id="runBtn">▶ Run query</button>
      <select id="sampleSelect">
        <option value="">— load a sample query —</option>
        <option value="all_customers">All customers</option>
        <option value="all_orders">All orders</option>
        <option value="top_spenders">Top spenders (join)</option>
        <option value="create_table">Create a new table</option>
      </select>
      <button id="resetBtn">Reset database</button>
      <span class="hint" id="timing"></span>
    </div>

    <div class="results">
      <div class="results-head">
        <span>Result</span>
        <span id="rowCount"></span>
      </div>
      <div class="results-body" id="resultsBody">
        <div class="msg">Run a query to see results here.</div>
      </div>
    </div>
  </main>
</div>

<footer>
  Built with <a href="https://sql.js.org" target="_blank" rel="noopener">sql.js</a> (SQLite compiled to WebAssembly) — no backend, no server, safe to host as a static site on GitHub Pages.
</footer>

<script>
let db;
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const runBtn = document.getElementById('runBtn');
const resetBtn = document.getElementById('resetBtn');
const sqlInput = document.getElementById('sqlInput');
const resultsBody = document.getElementById('resultsBody');
const rowCountEl = document.getElementById('rowCount');
const timingEl = document.getElementById('timing');
const schemaList = document.getElementById('schemaList');
const sampleSelect = document.getElementById('sampleSelect');

const SEED_SQL = `
CREATE TABLE customers (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  city TEXT
);

CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer_id INTEGER,
  item TEXT,
  amount REAL,
  FOREIGN KEY (customer_id) REFERENCES customers(id)
);

INSERT INTO customers (id, name, city) VALUES
 (1, 'Arun', 'Chennai'),
 (2, 'Divya', 'Coimbatore'),
 (3, 'Karthik', 'Madurai'),
 (4, 'Priya', 'Chennai');

INSERT INTO orders (id, customer_id, item, amount) VALUES
 (1, 1, 'Keyboard', 1200),
 (2, 1, 'Monitor', 8500),
 (3, 2, 'Mouse', 450),
 (4, 3, 'Laptop Stand', 900),
 (5, 4, 'Webcam', 2200),
 (6, 4, 'Headset', 1800);
`;

const SAMPLES = {
  all_customers: "SELECT * FROM customers;",
  all_orders: "SELECT * FROM orders;",
  top_spenders: `SELECT customers.name, COUNT(orders.id) AS total_orders, SUM(orders.amount) AS total_spent
FROM customers
JOIN orders ON orders.customer_id = customers.id
GROUP BY customers.name
ORDER BY total_spent DESC;`,
  create_table: `CREATE TABLE notes (
  id INTEGER PRIMARY KEY,
  content TEXT
);

INSERT INTO notes (content) VALUES ('hello from QueryDeck');

SELECT * FROM notes;`
};

sampleSelect.addEventListener('change', () => {
  if (sampleSelect.value) {
    sqlInput.value = SAMPLES[sampleSelect.value];
    sampleSelect.value = "";
  }
});

async function initDb() {
  statusText.textContent = 'loading engine…';
  const SQL = await initSqlJs({
    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
  });
  db = new SQL.Database();
  db.run(SEED_SQL);
  statusDot.style.background = '#3ea79b';
  statusText.textContent = 'ready — SQLite engine loaded in-browser';
  renderSchema();
  runQuery(true);
}

function renderSchema() {
  const res = db.exec(`SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';`);
  if (!res.length) { schemaList.innerHTML = '<div class="hint">No tables yet.</div>'; return; }
  const tableNames = res[0].values.map(r => r[0]);
  schemaList.innerHTML = '';
  tableNames.forEach(t => {
    const info = db.exec(`PRAGMA table_info(${t});`);
    const cols = info.length ? info[0].values : [];
    const block = document.createElement('div');
    block.className = 'table-block';
    const colHtml = cols.map(c => {
      const colName = c[1], pk = c[5];
      return pk ? `<span class="pk">${colName} (PK)</span>` : colName;
    }).join('<br/>');
    block.innerHTML = `<div class="t-name">${t}</div><div class="t-cols">${colHtml}</div>`;
    schemaList.appendChild(block);
  });
}

function runQuery(silent) {
  const query = sqlInput.value.trim();
  if (!query) return;
  const start = performance.now();
  try {
    const res = db.exec(query);
    const elapsed = (performance.now() - start).toFixed(1);
    timingEl.textContent = `${elapsed} ms`;

    if (!res.length) {
      resultsBody.innerHTML = `<div class="msg ok">Query ran successfully. No rows returned.</div>`;
      rowCountEl.textContent = '';
      renderSchema();
      return;
    }

    const { columns, values } = res[0];
    rowCountEl.textContent = `${values.length} row${values.length !== 1 ? 's' : ''}`;

    let html = '<table><thead><tr>' + columns.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
    values.forEach(row => {
      html += '<tr>' + row.map(cell => `<td>${cell === null ? '<em style="color:#4a5c6a">NULL</em>' : cell}</td>`).join('') + '</tr>';
    });
    html += '</tbody></table>';
    resultsBody.innerHTML = html;
    renderSchema();
  } catch (e) {
    if (!silent) {
      resultsBody.innerHTML = `<div class="msg err">Error: ${e.message}</div>`;
      rowCountEl.textContent = '';
    }
  }
}

runBtn.addEventListener('click', () => runQuery(false));
resetBtn.addEventListener('click', () => {
  db.run('DROP TABLE IF EXISTS customers; DROP TABLE IF EXISTS orders; DROP TABLE IF EXISTS notes;');
  db.run(SEED_SQL);
  renderSchema();
  resultsBody.innerHTML = '<div class="msg ok">Database reset to sample data.</div>';
  rowCountEl.textContent = '';
});

sqlInput.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runQuery(false);
  }
});

initDb();
</script>

</body>
</html>
